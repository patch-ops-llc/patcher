# Slack app manifest for the Patcher hub app. Create it in the PatchOps workspace only:
# https://api.slack.com/apps -> Create New App -> From a manifest.
#
# The five URLs below point at the web service's Railway domain. If that address changes
# (a custom domain, for example), change all five here and in the Slack app.
# docs/setup-checklist.md has the full steps.
#
# Changed for the Slack reader (phase 4a): the second redirect URL, the ten read-only user
# scopes, the four `message.*` user events and `tokens_revoked`. An app created from an
# earlier copy of this file has to be updated: section 8 of the checklist says how.
_metadata:
  major_version: 2
  minor_version: 1
display_information:
  name: Patcher
  description: Recommends operations work and acts only after someone approves it.
  background_color: "#1f2937"
features:
  app_home:
    home_tab_enabled: true
    messages_tab_enabled: false
    messages_tab_read_only_enabled: true
  bot_user:
    display_name: Patcher
    always_online: true
  slash_commands:
    - command: /ops
      url: https://web-production-944a4680.up.railway.app/slack/commands
      description: Patcher status and controls
      usage_hint: status | pending | pause | resume
      should_escape: false
oauth_config:
  redirect_urls:
    # Sign in with Slack for the control UI.
    - https://web-production-944a4680.up.railway.app/auth/slack/callback
    # The owner's authorisation to read PatchOps (Slack inbox -> Connect PatchOps).
    - https://web-production-944a4680.up.railway.app/auth/slack/reader/callback
  scopes:
    user:
      # Sign in with Slack for the control UI.
      - openid
      - profile
      - email
      # The Slack reader. Granted by one person, the owner, from the control UI, and only
      # in PatchOps. Every scope here reads; none can post, edit, delete or join. They
      # reach what that person can see: public channels, private channels, group direct
      # messages and direct messages he is in.
      - channels:history
      - groups:history
      - mpim:history
      - im:history
      # Which conversations he is in, and their names, for the catch-up after a gap.
      - channels:read
      - groups:read
      - mpim:read
      - im:read
      # Display names in place of member IDs, and the workspace's address for links.
      - users:read
      - team:read
    # The least the foundation needs. Later phases add their own scopes with their features.
    bot:
      # Post and edit recommendations in channels the bot has been invited to.
      - chat:write
      # The /ops command.
      - commands
      # Channel names for the routing picker in settings.
      - channels:read
      - groups:read
settings:
  event_subscriptions:
    request_url: https://web-production-944a4680.up.railway.app/slack/events
    bot_events:
      - app_home_opened
      # Tells Patcher when the owner's authorisation to read was removed, so it can say so.
      - tokens_revoked
    # Delivered for each person who granted the user scopes above. Patcher accepts them
    # only for the one connected reader and drops the rest unread.
    user_events:
      - message.channels
      - message.groups
      - message.mpim
      - message.im
  interactivity:
    is_enabled: true
    request_url: https://web-production-944a4680.up.railway.app/slack/interactions
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
